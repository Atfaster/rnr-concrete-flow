name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Minimum supported dependencies
            tfc_file: '7442504'
            rnr_file: '7339318'
          - name: Latest tested dependencies
            tfc_file: '8242625'
            rnr_file: '8099778'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Build and test
        run: >-
          ./gradlew clean build --no-daemon
          -Ptfc_curse_file=${{ matrix.tfc_file }}
          -Prnr_curse_file=${{ matrix.rnr_file }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rnr-concrete-flow-${{ matrix.rnr_file }}-${{ matrix.tfc_file }}
          path: build/libs/*.jar
