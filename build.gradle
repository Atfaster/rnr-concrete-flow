plugins {
    id 'java'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

group = mod_group
version = mod_version

base {
    archivesName = "${rootProject.name}-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

repositories {
    maven {
        url = 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

minecraft {
    mappings channel: 'official', version: minecraft_version

    runs {
        client {
            workingDirectory project.file('run/client')
            property 'forge.logging.console.level', 'info'
            mods {
                rnr_concrete_flow {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run/server')
            property 'forge.logging.console.level', 'info'
            args '--nogui'
            mods {
                rnr_concrete_flow {
                    source sourceSets.main
                }
            }
        }
    }
}

mixin {
    add sourceSets.main, 'rnr_concrete_flow.refmap.json'
    config 'rnr_concrete_flow.mixins.json'
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor "org.spongepowered:mixin:${mixin_version}:processor"

    implementation fg.deobf("curse.maven:terrafirmacraft-302973:${tfc_curse_file}")
    implementation fg.deobf("curse.maven:roads-and-roofs-tfc-1048212:${rnr_curse_file}")

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('processResources', ProcessResources).configure {
    def properties = [
        mod_id: mod_id,
        mod_name: mod_name,
        mod_version: mod_version,
        mod_authors: mod_authors,
        mod_license: mod_license
    ]
    inputs.properties properties
    filesMatching('META-INF/mods.toml') {
        expand properties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(
            'Specification-Title': mod_name,
            'Specification-Vendor': mod_authors,
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': mod_authors,
            'MixinConfigs': 'rnr_concrete_flow.mixins.json'
        )
    }
    finalizedBy 'reobfJar'
}

tasks.register('verifyReleaseJar') {
    dependsOn tasks.named('jar')

    doLast {
        File releaseJar = tasks.named('jar', Jar).get().archiveFile.get().asFile
        Set<String> entries = zipTree(releaseJar).files.collect {
            it.path.replace('\\', '/')
        } as Set

        [
            'META-INF/mods.toml',
            'rnr_concrete_flow.mixins.json',
            'rnr_concrete_flow.refmap.json'
        ].each { required ->
            if (!entries.any { it.endsWith("/${required}") || it == required }) {
                throw new GradleException("Release JAR is missing ${required}")
            }
        }

        [
            'net/minecraft/',
            'net/minecraftforge/',
            'net/dries007/',
            'com/therighthon/'
        ].each { forbidden ->
            if (entries.any { it.contains("/${forbidden}") || it.startsWith(forbidden) }) {
                throw new GradleException("Release JAR bundles forbidden dependency classes under ${forbidden}")
            }
        }
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('verifyReleaseJar')
}
