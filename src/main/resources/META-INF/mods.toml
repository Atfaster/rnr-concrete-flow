description='''
Improves Roads and Roofs TFC concrete construction.

Concrete fills up to 25 nearest connected road foundations without wasting
capacity on blocked branches, can flow down stepped slopes, and spreads at a
configurable rate. RNR road blocks need only one horizontal support to resist
landslides, and concrete powder can consume part of excess barrel water.
'''

